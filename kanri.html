-- 1. 管理者テーブルと管理者判定関数

create table if not exists public.admins (

user_id uuid primary key references auth.users(id) on delete cascade

);

alter table public.admins enable row level security;

revoke all on public.admins from anon, authenticated;

create or replace function public.is_admin()

returns boolean

language sql

stable

security definer

set search_path = ''

as $$

select exists (

select 1 from public.admins

where user_id = (select auth.uid())

);

$$;

revoke all on function public.is_admin() from public, anon;

grant execute on function public.is_admin() to authenticated;

-- 2. 管理データテーブル

create table if not exists public.news (

id text primary key default gen_random_uuid()::text,

posted_on date not null default current_date,

title text not null,

body text,

active boolean not null default true

);

create table if not exists public.coupons (

id text primary key default gen_random_uuid()::text,

title text not null,

discount text,

body text,

code text,

start_on date,

end_on date,

sort integer not null default 0,

active boolean not null default true

);

create table if not exists public.therapists (

id text primary key default gen_random_uuid()::text,

name text not null,

photo text,

age integer,

height integer,

bust integer,

cup text,

waist integer,

hip integer,

categories text[] not null default '{}',

x_url text,

food text,

prev_job text,

kyun text,

holiday text,

message text,

manager_comment text,

active boolean not null default true

);

create table if not exists public.schedule (

id text primary key default gen_random_uuid()::text,

therapist_id text not null references public.therapists(id) on delete cascade,

work_date date not null,

start_time text not null,

end_time text not null

);

create table if not exists public.diary (

id text primary key default gen_random_uuid()::text,

therapist_id text not null references public.therapists(id) on delete cascade,

posted_at timestamptz not null default now(),

title text not null,

body text,

active boolean not null default true

);

-- 3. RLSと権限

alter table public.news enable row level security;

alter table public.coupons enable row level security;

alter table public.therapists enable row level security;

alter table public.schedule enable row level security;

alter table public.diary enable row level security;

revoke all on public.news, public.coupons, public.therapists, public.schedule, public.diary from anon, authenticated;

grant select on public.news, public.coupons to anon, authenticated;

grant select, insert, update, delete on public.news, public.coupons, public.therapists, public.schedule, public.diary to authenticated;

drop policy if exists "admin all" on public.news;

create policy "admin all" on public.news for all to authenticated

using (public.is_admin()) with check (public.is_admin());

create policy "public read" on public.news for select to anon, authenticated

using (active = true);

create policy "admin all" on public.coupons for all to authenticated

using (public.is_admin()) with check (public.is_admin());

create policy "public read" on public.coupons for select to anon, authenticated

using (active = true);

create policy "admin all" on public.therapists for all to authenticated

using (public.is_admin()) with check (public.is_admin());

drop policy if exists "admin all" on public.schedule;

create policy "admin all" on public.schedule for all to authenticated

using (public.is_admin()) with check (public.is_admin());

drop policy if exists "admin all" on public.diary;

create policy "admin all" on public.diary for all to authenticated

using (public.is_admin()) with check (public.is_admin());

-- 4. お客様向け公開ビュー(公開する列と行をここで限定)

create or replace view public.public_therapists

with (security_barrier = true) as

select id, name, photo, age, height, bust, cup, waist, hip, categories,

x_url, catch, hobby, specialty, food, prev_job, kyun, holiday,

message, manager_comment, sample, sort

from public.therapists

where active = true;

create or replace view public.public_schedule

with (security_barrier = true) as

select s.id, s.therapist_id, s.work_date, s.start_time, s.end_time

from public.schedule s

join public.therapists t on t.id = s.therapist_id

where t.active = true;

create or replace view public.public_diary

with (security_barrier = true) as

select d.id, d.therapist_id, d.posted_at, d.title, d.body, d.photo

from public.diary d

join public.therapists t on t.id = d.therapist_id

where d.active = true and t.active = true;

revoke all on public.therapists, public.schedule, public.diary from anon;

grant usage on schema public to anon, authenticated;

grant select on public.public_therapists, public.public_schedule, public.public_diary to anon, authenticated;

function timeMinutes(t){const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||''));return m?Number(m[1])*60+Number(m[2]):0}
function fmtTime(n){n=((n%1440)+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60)}
function dateToday(){return ymd(new Date())}
function endFor(start,minutes){const total=timeMinutes(start)+Number(minutes||0);return {time:fmtTime(total),offset:Math.floor(total/1440)}}

 ]);

  const work_date=form.elements.work_date.value,therapist_id=form.elements.therapist_id.value,start_time=form.elements.start_time.value,course_minutes=Number(form.elements.course_minutes.value),end=endFor(start_time,course_minutes);
  // Prevent overlapping reservations for the same cast, including overnight courses.
  const {data:existing,error:qerr}=await sb.from('reservations').select('id,start_time,end_time,end_day_offset').eq('work_date',work_date).eq('therapist_id',therapist_id);
  if(qerr)return alert(qerr.message);
  const ns=timeMinutes(start_time),ne=ns+course_minutes;
  const overlap=(existing||[]).some(x=>x.id!==r.id&&ns<timeMinutes(x.end_time)+Number(x.end_day_offset||0)*1440&&timeMinutes(x.start_time)<ne);
  if(overlap)return alert('同じキャストに時間が重なる予約があります。時間を変更してください。');
  const payload={work_date,therapist_id,start_time,end_time:end.time,end_day_offset:end.offset,course_minutes,customer_name:form.elements.customer_name.value.trim()||null,customer_phone:form.elements.customer_phone.value.trim()||null,payment_method:'現金'};
  const result=r.id?await sb.from('reservations').update(payload).eq('id',r.id):await sb.from('reservations').insert(payload);
  if(result.error)return alert(result.error.message);
  await reservationsPage();
 };
}

async function shopEdit(){const c=T[tab],mn=$('#mn');

const{data,error}=await sb.from('shop_info').select('*').eq('id',1).maybeSingle();

if(error)return mn.innerHTML=`<p class="m">${esc(error.message)}</p>`;

const r=data||{};

mn.innerHTML=`<form id="ef"><h2>店舗情報を編集</h2>${c.f.map(f=>inp(f,r[f[0]])).join('')}<button class="p">保存</button><span id="ok"></span></form>`;

$('#ef').onsubmit=async e=>{e.preventDefault();const o={id:1,updated_at:new Date().toISOString()};

for(const[k]of c.f){const v=e.target.elements[k].value.trim();o[k]=v===''?null:v}

const{error}=await sb.from('shop_info').upsert(o);

error?alert(error.message):$('#ok').textContent=' 保存しました'}}

const inp=([k,l,t],v)=>{let h;

if(t==='area')h=`<textarea name="${k}" rows="4">${esc(v)}</textarea>`;

else if(t==='bool')h=`<input type="checkbox" name="${k}" ${v?'checked':''}>`;

else if(t==='th')h=`<select name="${k}">${TH.map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;

else if(t==='img')h=`<input type="hidden" name="${k}" value="${esc(v)}">${v?`<img class="pv" src="${esc(v)}">`:''}<input type="file" accept="image/*" data-k="${k}">`;

else h=`<input name="${k}" type="${{date:'date',num:'number',dt:'datetime-local'}[t]||'text'}" ${t==='num'?'step="any"':''} value="${esc(t==='tags'?(v||[]).join(','):t==='dt'&&v?lt(v):v)}">`;

return `<label>${l}${h}</label>`};

async function up(file){const im=await createImageBitmap(file),s=Math.min(1,1200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);

const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)),p=tab+'/'+crypto.randomUUID()+'.jpg',{error}=await sb.storage.from('photos').upload(p,b,{contentType:'image/jpeg'});if(error)throw error;return sb.storage.from('photos').getPublicUrl(p).data.publicUrl}

function form(r){const c=T[tab],mn=$('#mn');

if(tab!=='therapists'&&c.f.some(f=>f[2]==='th')&&!TH.length)return alert('先に「キャスト一覧」でキャストを登録してください');

mn.innerHTML=`<form id="ef"><h2>${c.l}を${r.id?'編集':'追加'}</h2>${c.f.map(f=>inp(f,f[2]==='th'&&!r[f[0]]?TH[0]?.id:r[f[0]])).join('')}<button class="p">保存</button><button type="button" class="alt" id="cn">キャンセル</button></form>`;

$('#cn').onclick=list;

$('#ef').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;e.target.disabled=true;try{e.target.form.elements[e.target.dataset.k].value=await up(f);e.target.insertAdjacentHTML('beforebegin','<p>アップロード済み(保存で反映)</p>')}catch(x){alert(x.message)}e.target.disabled=false};

$('#ef').onsubmit=async e=>{e.preventDefault();const o={};

for(const[k,,t]of c.f){const el=e.target.elements[k];let v=t==='bool'?el.checked:el.value;

if(t==='num')v=v===''?null:+v;else if(t==='tags')v=v.split(/[,、]/).map(s=>s.trim()).filter(Boolean);else if(t==='dt')v=v?new Date(v).toISOString():null;else if(v==='')v=null;o[k]=v}

const{error}=await(r.id?sb.from(tab).update(o).eq('id',r.id):sb.from(tab).insert(o));

if(error)return alert(error.message);

if(tab==='therapists'){const{data}=await sb.from('therapists').select('id,name').order('sort');TH=data||[]}list()}}

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')login()});boot();

</script></body></html>
