<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOONone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>:root{--ink:#1d1b22;--gold:#a9863f;--gold2:#d8bd7c;--blue:#bcdcec;--mist:#f4f8fb;--line:#e6e0d2}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.8 "Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:hidden}
img{max-width:100%;height:auto;display:block}a{color:inherit}

header{position:sticky;top:0;z-index:20;background:rgba(29,27,34,.97);color:#fff;border-bottom:2px solid var(--gold)}
.bar{max-width:1080px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;color:var(--gold2);text-decoration:none;letter-spacing:.04em}
nav a{color:#fff;text-decoration:none;margin-left:28px;font-size:14px;padding:6px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current]{border-color:var(--gold2)}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
.burger i{display:block;height:2px;background:#fff;margin:6px 10px}
.hero img{width:100%;max-width:1400px;margin:auto}
main{max-width:1080px;margin:auto;padding:0 16px 56px}
.sec{padding-top:44px}.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--gold);margin-bottom:18px}

h1.page{font-size:30px;margin:36px 0 6px;border-bottom:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{border:1px solid var(--line)}.ph{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,var(--mist),var(--blue));display:grid;place-items:center;color:#fff}
.ph img{width:100%;height:100%;object-fit:cover}.ph svg{width:44%;opacity:.8}
.x{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(29,27,34,.75);color:#fff;display:grid;place-items:center;font:700 12px sans-serif;text-decoration:none}
.info{padding:10px 12px;font-size:13px;line-height:1.7}.info h3{margin:0;font-size:19px}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:11px;padding:0 7px;margin:2px 4px 0 0}
.sample{background:var(--blue);color:var(--ink);font-size:10px;padding:0 6px;margin-left:6px}
.time{color:var(--gold);font-weight:700}
.news{height:260px;overflow-y:auto;border:1px solid var(--gold);background:var(--mist);padding:6px 16px}
.news article{padding:12px 0;border-bottom:1px dashed var(--line)}.news time{font-size:12px;color:var(--gold)}.news h3{margin:0;font-size:17px}.news p{margin:4px 0 0;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:16px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}td:last-child{font:600 22px "Cormorant Garamond",serif;color:var(--gold)}
dl{display:grid;grid-template-columns:9em 1fr;margin:18px 0}dt,dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}dt{font-weight:700}
.empty{color:#8a8794}
footer{background:var(--ink);color:#bbb;text-align:center;padding:24px 16px;font-size:12px}footer .logo{display:block;font-size:22px;color:var(--gold2)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.burger{display:block}
nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--ink);padding:8px 16px 16px}nav.open{display:block}
nav a{display:block;margin:0;padding:14px 0;border-bottom:1px solid #333}dl{grid-template-columns:7em 1fr}}
dd{white-space:pre-line}.btn{display:block;text-align:center;background:#2f5d7c;color:#fff;text-decoration:none;padding:16px;margin:24px 0;font-weight:700;border-bottom:3px solid var(--gold)}
h2.sub{font-size:24px;margin:40px 0 0;border-bottom:1px solid var(--gold)}main h3{font-size:18px;margin:22px 0 0;color:var(--gold)}table.opt{margin-top:6px}table.opt td{padding:12px 16px}.costume{margin-top:20px;font-weight:700}
.pl{display:grid;place-items:center;width:100%;height:100%}.info h3 a{text-decoration:none}
.dy{display:grid;grid-template-columns:140px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}.dy img{width:100%;aspect-ratio:3/4;object-fit:cover}
.dy time{font-size:12px;color:var(--gold)}.dy h3{margin:0;font-size:18px}.dy p{margin:4px 0;font-size:14px;white-space:pre-line}.by{font-size:13px;color:var(--gold)}
.pf{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px;align-items:start;margin-top:24px}.pf .ph{aspect-ratio:3/4}.pf h1.page{margin-top:0}.catch{font-size:20px;color:var(--gold);margin:6px 0}
.qa{border:1px solid var(--line);margin-top:12px}.qa h4{margin:0;padding:8px 14px;background:var(--mist);border-bottom:1px solid var(--line);font-size:14px}.qa p{margin:0;padding:10px 14px;white-space:pre-line}.qa.msg{border-color:var(--gold)}
@media(max-width:560px){.pf{grid-template-columns:1fr}.dy{grid-template-columns:100px 1fr}}
</style></head><body><div id="view"></div>

, "photo": null}]}, "coupons": {"coupons": []}};
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 const r=INLINE[n];if(!r)throw 0;return r};
