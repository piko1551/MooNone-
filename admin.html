<script type="text/plain" id="sqlsrc">
-- MOONone Supabase 構築SQL(最終版)
-- 実行方法: Supabase の SQL Editor に全文を貼って Run(何度実行しても同じ結果になります)
-- 保存先の目安: supabase/migrations/20261112000000_moonone_setup.sql
-- 注意: index.html は公開ビュー(public_*)から読みます。このSQLを実行済みであることが前提です。

-- 1. 管理者テーブルと管理者判定関数
create table if not exists public.admins (
  user_id uuid primary key references auth.users(id) on delete cascade
);

alter table public.admins enable row level security;
revoke all on public.admins from anon, authenticated;

create or replace function public.is_admin()
returns boolean
language sql
stable
security definer
set search_path = ''
as $$
  select exists (
    select 1 from public.admins
    where user_id = (select auth.uid())
  );
$$;

revoke all on function public.is_admin() from public, anon;
grant execute on function public.is_admin() to authenticated;

-- 2. 管理データテーブル
create table if not exists public.news (
  id text primary key default gen_random_uuid()::text,
  posted_on date not null default current_date,
  title text not null,
  body text,
  active boolean not null default true
);

create table if not exists public.coupons (
  id text primary key default gen_random_uuid()::text,
  title text not null,
  discount text,
  body text,
  code text,
  start_on date,
  end_on date,
  sort integer not null default 0,
  active boolean not null default true
);

create table if not exists public.therapists (
  id text primary key default gen_random_uuid()::text,
  name text not null,
  photo text,
  age integer,
  height integer,
  bust integer,
  cup text,
  waist integer,
  hip integer,
  categories text[] not null default '{}',
  x_url text,
  catch text,
  hobby text,
  specialty text,
  food text,
  prev_job text,
  kyun text,
  holiday text,
  message text,
  manager_comment text,
  sample boolean not null default false,
  sort integer not null default 0,
  active boolean not null default true
);

create table if not exists public.schedule (
  id text primary key default gen_random_uuid()::text,
  therapist_id text not null references public.therapists(id) on delete cascade,
  work_date date not null,
  start_time text not null,
  end_time text not null
);

create table if not exists public.diary (
  id text primary key default gen_random_uuid()::text,
  therapist_id text not null references public.therapists(id) on delete cascade,
  posted_at timestamptz not null default now(),
  title text not null,
  body text,
  photo text,
  active boolean not null default true
);

-- 3. RLSと権限
alter table public.news enable row level security;
alter table public.coupons enable row level security;
alter table public.therapists enable row level security;
alter table public.schedule enable row level security;
alter table public.diary enable row level security;

revoke all on public.news, public.coupons, public.therapists, public.schedule, public.diary from anon, authenticated;
grant select on public.news, public.coupons to anon, authenticated;
grant select, insert, update, delete on public.news, public.coupons, public.therapists, public.schedule, public.diary to authenticated;

drop policy if exists "admin all" on public.news;
create policy "admin all" on public.news for all to authenticated
using (public.is_admin()) with check (public.is_admin());

drop policy if exists "public read" on public.news;
create policy "public read" on public.news for select to anon, authenticated
using (active = true);

drop policy if exists "admin all" on public.coupons;
create policy "admin all" on public.coupons for all to authenticated
using (public.is_admin()) with check (public.is_admin());

drop policy if exists "public read" on public.coupons;
create policy "public read" on public.coupons for select to anon, authenticated
using (active = true);

drop policy if exists "admin all" on public.therapists;
create policy "admin all" on public.therapists for all to authenticated
using (public.is_admin()) with check (public.is_admin());

drop policy if exists "admin all" on public.schedule;
create policy "admin all" on public.schedule for all to authenticated
using (public.is_admin()) with check (public.is_admin());

drop policy if exists "admin all" on public.diary;
create policy "admin all" on public.diary for all to authenticated
using (public.is_admin()) with check (public.is_admin());

-- 旧SQLで作った「public read」が残っていれば削除(公開側はビュー経由に一本化)
drop policy if exists "public read" on public.therapists;
drop policy if exists "public read" on public.schedule;
drop policy if exists "public read" on public.diary;

-- 4. お客様向け公開ビュー(公開する列と行をここで限定)
create or replace view public.public_therapists
with (security_barrier = true) as
select id, name, photo, age, height, bust, cup, waist, hip, categories,
x_url, catch, hobby, specialty, food, prev_job, kyun, holiday,
message, manager_comment, sample, sort
from public.therapists
where active = true;

create or replace view public.public_schedule
with (security_barrier = true) as
select s.id, s.therapist_id, s.work_date, s.start_time, s.end_time
from public.schedule s
join public.therapists t on t.id = s.therapist_id
where t.active = true;

create or replace view public.public_diary
with (security_barrier = true) as
select d.id, d.therapist_id, d.posted_at, d.title, d.body, d.photo
from public.diary d
join public.therapists t on t.id = d.therapist_id
where d.active = true and t.active = true;

revoke all on public.therapists, public.schedule, public.diary from anon;
grant usage on schema public to anon, authenticated;
grant select on public.public_therapists, public.public_schedule, public.public_diary to anon, authenticated;

-- 5. 写真ストレージ(公開読み取り・書き込みは管理者のみ・5MB以下のJPEG/PNG/WebP)
insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
values ('photos', 'photos', true, 5242880, array['image/jpeg','image/png','image/webp'])
on conflict (id) do update
set public = true,
    file_size_limit = 5242880,
    allowed_mime_types = array['image/jpeg','image/png','image/webp'];

drop policy if exists "photos admin" on storage.objects;
create policy "photos admin" on storage.objects for all to authenticated
using (bucket_id = 'photos' and public.is_admin())
with check (bucket_id = 'photos' and public.is_admin());

<script>
const C=window.MOON_CONFIG||{},$=s=>document.querySelector(s),app=$('#app'),pad=n=>String(n).padStart(2,'0');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!C.url||/YOUR-/.test(C.url)){app.innerHTML='<div class="box"><h1>初期設定</h1><p>① Supabase の SQL Editor に下のSQLを貼って Run<br>② Project URL と Publishable key を、このファイル先頭の MOON_CONFIG に記入(index.html にも同じ値を)</p><button type="button" id="cp">SQLをコピー</button><pre id="sq"></pre></div>';$('#sq').textContent=$('#sqlsrc').textContent;$('#cp').onclick=async()=>{await navigator.clipboard.writeText($('#sqlsrc').textContent);$('#cp').textContent='コピーしました'};throw 0}
const sb=supabase.createClient(C.url,C.anon);let TH=[],tab='news';
const nm=id=>(TH.find(t=>t.id===id)||{}).name||'?',ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),lt=s=>{const d=new Date(s);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const A=['active','公開する','bool'];
const T={
 news:{l:'最新情報',o:['posted_on',0],s:r=>r.posted_on+'　'+r.title,f:[['posted_on','日付','date'],['title','タイトル','text'],['body','本文','area'],A]},
 coupons:{l:'割引・クーポン',o:['sort',1],s:r=>r.title+'　'+(r.discount||''),f:[['title','タイトル','text'],['discount','割引内容(例 1,000円OFF)','text'],['body','詳細','area'],['code','クーポンコード','text'],['start_on','開始日(空=すぐ)','date'],['end_on','終了日(空=無期限)','date'],['sort','表示順(小さい順)','num'],A]},
 schedule:{l:'出勤情報',o:['work_date',0],s:r=>r.work_date+'　'+nm(r.therapist_id)+'　'+r.start_time+'-'+r.end_time,f:[['work_date','日付','date'],['therapist_id','キャスト','th'],['start_time','開始(例 12:00)','text'],['end_time','終了(例 20:00)','text']]},
 therapists:{l:'キャスト一覧',o:['sort',1],s:r=>r.name+(r.active?'':'(非公開)'),f:[['name','名前','text'],['photo','写真','img'],['age','年齢','num'],['height','身長(cm)','num'],['bust','バスト','num'],['cup','カップ','text'],['waist','ウエスト','num'],['hip','ヒップ','num'],['categories','カテゴリー(カンマ区切り)','tags'],['x_url','XのURL','text'],['catch','キャッチコピー','text'],['hobby','趣味','text'],['specialty','得意な施術','text'],['food','好きな食べ物','text'],['prev_job','前のお仕事','text'],['kyun','男性にキュンとする瞬間','text'],['holiday','休みの日は何をしている?','text'],['message','本人からのメッセージ','area'],['manager_comment','店長のコメント','area'],['sample','サンプル表示','bool'],['sort','表示順(小さい順)','num'],A]},
 diary:{l:'写メ日記',o:['posted_at',0],s:r=>lt(r.posted_at).replace('T',' ')+'　'+nm(r.therapist_id)+'　'+r.title,f:[['therapist_id','キャスト','th'],['posted_at','投稿日時','dt'],['title','タイトル','text'],['body','本文','area'],['photo','写真','img'],A]}};
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data:ok}=await sb.rpc('is_admin');if(!ok)return denied(session.user);
 const{data}=await sb.from('therapists').select('id,name').order('sort');TH=data||[];shell()}
function login(m=''){app.innerHTML=`<form id="lf" class="box"><h1>MOONone 管理</h1><p class="m">${m}</p><label>メールアドレス<input name="em" type="email" required autocomplete="username"></label><label>パスワード<input name="pw" type="password" required autocomplete="current-password"></label><button>ログイン</button><button type="button" id="gh" class="alt">GitHubでログイン</button></form>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:e.target.em.value,password:e.target.pw.value});error?login('ログインに失敗しました'):boot()};
 $('#gh').onclick=()=>sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.origin+location.pathname}})}
function denied(u){app.innerHTML=`<div class="box"><h1>管理者未登録</h1><p>このアカウントはまだ管理者に登録されていません。Supabase の SQL Editor で次を実行してください。</p><pre>insert into admins(user_id) values ('${esc(u.id)}');</pre><button id="lo">ログアウト</button></div>`;$('#lo').onclick=out}

 $('#lo').onclick=out;document.querySelector('nav').onclick=e=>{const k=e.target.dataset.t;if(k){tab=k;shell()}};list()}
async function list(){const c=T[tab],mn=$('#mn');mn.innerHTML='読み込み中…';
 const{data,error}=await sb.from(tab).select('*').order(c.o[0],{ascending:!!c.o[1]});if(error)return mn.innerHTML=`<p class="m">${esc(error.message)}</p>`;
 mn.innerHTML=`<button class="p" id="nw">＋ 新規追加</button>`+(data.map(r=>`<div class="row"><span>${esc(c.s(r))}</span><span><button data-e="${esc(r.id)}">編集</button> <button data-d="${esc(r.id)}">削除</button></span></div>`).join('')||'<p>まだありません。</p>');
 $('#nw').onclick=()=>form({active:true,posted_on:ymd(new Date()),posted_at:new Date().toISOString(),sort:0});
 mn.onclick=async e=>{const b=e.target,id=b.dataset.e||b.dataset.d;if(!id)return;

const inp=([k,l,t],v)=>{let h;
 if(t==='area')h=`<textarea name="${k}" rows="4">${esc(v)}</textarea>`;
 else if(t==='bool')h=`<input type="checkbox" name="${k}" ${v?'checked':''}>`;

 else if(t==='img')h=`<input type="hidden" name="${k}" value="${esc(v)}">${v?`<img class="pv" src="${esc(v)}">`:''}<input type="file" accept="image/*" data-k="${k}">`;
 else h=`<input name="${k}" type="${{date:'date',num:'number',dt:'datetime-local'}[t]||'text'}" ${t==='num'?'step="any"':''} value="${esc(t==='tags'?(v||[]).join(','):t==='dt'&&v?lt(v):v)}">`;

async function up(file){const im=await createImageBitmap(file),s=Math.min(1,1200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
